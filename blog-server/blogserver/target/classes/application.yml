server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./data/blogdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  # 必须是 32 个字符以上的长字符串
  secret: MxjSuperSecretKeyForBlogJwtAuthenticationMustBeLongEnough2026

cors:
  # 支持多个域名，用逗号隔开
  allowed-origins: "http://localhost:5173,http://127.0.0.1:5173"