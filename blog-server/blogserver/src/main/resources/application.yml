server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:qwer0987} # 生产环境通过环境变量注入

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false # 生产环境建议关闭
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

jwt:
  # 生产环境务必在服务器通过 export JWT_SECRET=xxx 覆盖
  secret: ${JWT_SECRET:MxjSuperSecretKeyForBlogJwtAuthenticationMustBeLongEnough2026}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 新增站点域名配置
app:
  domain: ${APP_DOMAIN:http://localhost:8080}